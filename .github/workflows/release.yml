# Pushing a version tag (v1.2.3) builds the extension and publishes it as a GitHub release, with
# the zip attached. The tag must match the version in package.json.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Build and zip
        run: npm run package

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body)
          cat > notes.md <<NOTES
          ## Install

          1. Download **universal-theme-$VERSION.zip** below and unzip it.
          2. In Chrome, open \`chrome://extensions\`, turn on **Developer mode**, click **Load unpacked**, and pick the unzipped folder.
          3. The settings page opens: paste your Jev API key from [console.typesafe.ai](https://console.typesafe.ai) and save.

          $changes
          NOTES
          gh release create "$GITHUB_REF_NAME" "release/universal-theme-$VERSION.zip" \
            --title "Universal Theme $VERSION" --notes-file notes.md
